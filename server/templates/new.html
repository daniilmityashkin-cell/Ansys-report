{% extends "base.html" %}{% block body %}
<h1>Новая генерация</h1><p class="sub">Файл замеров в формате проекта «РВС · Геометрия стенки» (JSON). Проверка бесплатна.</p>
<form class="card" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf }}">
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<label>Название (например, РВС-9985)</label><input type="text" name="title" value="{{ title or '' }}" maxlength="200">
<label>Файл замеров (.json)</label><input type="file" name="file" accept=".json,application/json">
<label>…или вставьте содержимое файла</label><textarea name="text">{{ text or '' }}</textarea>
<p><button class="btn">Проверить замеры</button></p></form>{% endblock %}
