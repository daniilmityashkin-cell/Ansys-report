# АНКЕТА: только то, чего нет в проекте Ansys. Геометрия, толщины, сетка, нагрузки, нивелировка
# («пустой»), результаты и устойчивость берутся из проекта Ansys (model_data.json + CSV из скриптов).
report:
  number: "{{number}}"
  year: {{year}}
  title: "{{title}}"
  executor_position: "{{executor_position}}"
  executor_name: "{{executor_name}}"
  contractor: "{{contractor}}"
  contractor_phone: "{{phone}}"

tank:                       # только описание объекта (в Ansys этого нет)
  name: "{{tank_name}}"
  tag: "{{tag}}"
  site: "{{site}}"
  site_number: "{{site_number}}"
  purpose: "{{purpose}}"
  product: "{{product}}"
  hazard_class: "{{hazard_class}}"
  roof_radius: {{roof_radius}}
  kmd: "{{kmd}}"
  product_density: {{product_density}}      # кг/м3 (если в Ansys нет объекта гидростатики)
  fill_level: {{fill_level}}                # мм

material:                   # свойства стали берутся из Engineering Data проекта Ansys; здесь — марка, стандарт и то, чего в Ansys нет
  name: "{{steel_name}}"        # пусто = название материала в Ansys
  standard: "{{steel_standard}}"
  density: 7850                 # запасные значения (09Г2С), если файла Engineering Data нет
  young_modulus_mpa: 206000
  poisson: 0.3
  yield_mpa: 325
  ultimate_mpa: 480
  yield_override: {{steel_yield_mpa}}      # введённая на сайте/в анкете сталь (пусто = из Ansys)
  ultimate_override: {{steel_ultimate_mpa}}
  elongation_pct: {{elongation_pct}}
  thickness_range: "{{steel_thickness_range}}"

ansys:
  model_data: model_data.json            # выгрузка export_model_data.py
  analysis_full: "{{analysis_full}}"
  load_labels:                           # пояснения к нагрузкам по их именам в Ansys (необязательно)
    "Fкр": "вес крыши, оборудования и площадок обслуживания"
    "Fизол ст": "вес тепловой изоляции стенки"
    "Fизол кр": "вес тепловой изоляции крыши"
    "Line Pressure": "снеговая нагрузка по верхней кромке стенки"
    "Pressure": "ветровая нагрузка"


survey:
  full: survey_full.csv                  # замеры «полного» (вход макроса формы стенки; в Ansys их нет)
  empty: auto                            # «пустой» — из радиусов колец сетки Ansys
  start_angle: 85
  points_per_belt: 15


