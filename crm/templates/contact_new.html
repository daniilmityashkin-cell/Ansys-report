{% extends "_base.html" %}{% block title %}Новый клиент{% endblock %}{% block body %}
<p><a class="muted" href="/contacts">← Клиенты</a></p><h1>Новый клиент / заявка</h1>{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form class="card" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="form-grid">
<label>Имя<input name="name"></label><label>Телефон<input name="phone" inputmode="tel"></label><label>Почта<input name="email" type="email"></label>
<label>Компания<input name="company"></label><label>Источник<input name="source" placeholder="звонок, выставка, рекомендация…"></label></div>
<label>Что нужно<textarea name="message"></textarea></label><p><button class="btn">Создать</button></p></form>
<p class="muted" style="font-size:13px">Создастся карточка, сделка «Новый лид» и задача связаться (если сценарий включён).</p>
{% endblock %}
