# Исходные данные расчёта резервуара. Всё, что в отчёте и Excel, берётся отсюда.
report:
  number: "ТО-019-26"
  year: 2026
  title: "Резервуара РВС-9985 №Т-001 на прочность и устойчивость"
  executor_position: "Доцент кафедры «Проектирование и строительство нефтяной и газовой промышленности»"
  executor_name: "Султанагомедов Т.С."
  contractor: >-
    Прочностной расчет методом конечных элементов выполнен плательщиком налога на
    профессиональный доход (самозанятый), зарегистрированный в ИФНС как Султанагомедов Тимур Султанагомедович.
  contractor_phone: "+79991344405"

tank:
  name: "РВС-9985"
  tag: "Т-001"
  site: "Иркутский завод полимеров"
  site_number: "5210-Т-001"
  purpose: "хранения технологической воды и противопожарного запаса воды"
  product: "Техническая вода"
  product_density: 1000        # кг/м3
  diameter: 28500              # мм
  wall_height: 17880           # мм
  roof_radius: 34200           # мм
  fill_level: 17200            # мм, расчётный уровень налива
  hazard_class: "КС-2а"
  kmd: "КМД №238 137 выполненного ООО «Самараэнергомонтажпроект», заказ №1453/2020 г."
  # толщины по поясам (номинальная = расчётная), мм; 12 поясов
  belts_thickness: [16, 14, 13, 12, 12, 12, 12, 12, 11, 11, 11, 11]
  bottom_thickness: 13
  belt_height: 1490            # мм, шаг поясов (высота одного пояса)

material:
  name: "09Г2С"
  standard: "ГОСТ 19281-2014"
  density: 7850
  young_modulus_mpa: 206000
  poisson: 0.3
  yield_mpa: 325
  ultimate_mpa: 480
  elongation_pct: 21
  thickness_range: "9,01-25"

loads:
  overpressure_kpa: 0
  overpressure_factor: 1.2
  load_factor: 1.3
  roof_load_factor: 1.05
  roof_mass_kg: 64156          # собственный вес крыши
  equipment_masses_kg: [819.5, 5151, 1571.8]   # оборудование и площадки
  combination_factor: 0.95
  roof_insulation_kg: 2080
  wall_insulation_kg: 4335
  snow_kpa: 1.8
  snow_factor: 1.4
  snow_blowoff: "Не учитывается"
  terrain: "А"
  wind_kpa: 0.3
  snow_linear_n_per_m: 11610   # по ф. 87 ГОСТ Р 58622-2019 (из отчёта-образца)

survey:
  full: survey_full.csv        # отклонения стенки, мм: полный резервуар
  empty: survey_empty.csv      # отклонения стенки, мм: после опорожнения
  start_angle: 85
  points_per_belt: 15

mesh:
  nodes: 62907
  elements: 62261
  element_size_mm: 200
  element_type: "SHELL181"

# результаты Ansys (максимум по каждому поясу, МПа)
results:
  full: Static_Structural_Full_belts.csv  # налив 17,2 м, без ветра (анализ «Static Structural Full», export_results.py)
  empty: Static_Structural_2_belts.csv    # пустой резервуар с ветром (анализ «Static Structural 2»)
  stability_csv: stability.csv
  stability_modes: 2                      # сколько мод брать из stability.csv
  stability_labels:                       # соответствие анализов ветру (по совпадению k с образцом отчёта)
    "Eigenvalue Buckling": "Направление ветра Y"
    "Eigenvalue Buckling 2": "Направление ветра Z"
  required_k: 1.0
  max_fill_m: 17.2

# папка с картинками из Ansys (необязательно); имена файлов см. README
images_dir: images

# Соответствие рисунков отчёта файлам из export_results.py (<анализ>_<результат>.png).
# Лишние строки можно удалять, недостающие рисунки заменяются красной заглушкой.
images:
  fig06_eq_stress: Static_Structural_Full_Equivalent_Stress.png
  fig07_membrane: Static_Structural_Full_Membrane_Stress.png
  fig08_fiber: Static_Structural_Full_Maximum_Principal_Stress.png
  fig09_deform: Static_Structural_Full_Total_Deformation.png
  fig10_empty_eq: Static_Structural_2_Equivalent_Stress.png
  fig11_empty_mem: Static_Structural_2_Membrane_Stress.png
  fig12_empty_fiber: Static_Structural_2_Bending_Stress.png
  fig13_empty_deform: Static_Structural_2_Total_Deformation.png
  fig_stab1: Eigenvalue_Buckling_Total_Deformation.png
  fig_stab2: Eigenvalue_Buckling_Total_Deformation_2.png
  fig_stab3: Eigenvalue_Buckling_2_Total_Deformation.png
  fig_stab4: Eigenvalue_Buckling_2_Total_Deformation_2.png
