{% extends "base.html" %}{% block body %}
<h1>Регистрация</h1>
<form class="card" method="post" style="max-width:480px"><input type="hidden" name="csrf" value="{{ csrf }}">
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<label>Почта</label><input type="email" name="email" value="{{ email or '' }}" required>
<label>Пароль (не короче 10 символов)</label><input type="password" name="password" minlength="10" required>
<label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="consent" value="1" style="margin-top:4px"><span>Согласен на обработку персональных данных (<a href="/privacy">политика</a>)</span></label>
<p><button class="btn">Зарегистрироваться</button></p></form>{% endblock %}
