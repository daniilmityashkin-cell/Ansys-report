<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Вход · CRM</title><link rel="stylesheet" href="/static/crm.css"></head><body><div class="login"><h1>ANSYS REPORT <span style="color:var(--accent)">CRM</span></h1>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Почта<input type="email" name="email" autocomplete="username" required></label>
<label>Пароль<input type="password" name="password" autocomplete="current-password" required></label><button class="btn" style="width:100%">Войти</button></form></div></body></html>
