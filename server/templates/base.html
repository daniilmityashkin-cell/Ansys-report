<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{% block title %}Геометрия РВС{% endblock %}</title><link rel="icon" href="/static/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/style.css"></head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<nav class="top"><b><a href="/"><img class="logo" src="/static/logo.svg" alt="">Геометрия РВС</a></b>
{% if user %}<a href="/cabinet">Кабинет</a><a href="/new">Новая генерация</a><a href="/subscription">Подписка</a>
<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="linkbtn">Выйти ({{ user.email }})</button></form>
{% else %}<a href="/login">Войти</a><a href="/register">Регистрация</a>{% endif %}</nav>
<main>{% block body %}{% endblock %}</main>
<footer class="foot"><span>© Геометрия РВС</span><a href="/privacy">Конфиденциальность</a></footer>
<script>
// показать/скрыть пароль
document.querySelectorAll(".pw button").forEach(function(b){b.addEventListener("click",function(){
  var i=b.parentNode.querySelector("input");var show=i.type==="password";i.type=show?"text":"password";
  b.classList.toggle("on",show);b.setAttribute("aria-label",show?"Скрыть пароль":"Показать пароль");});});
// живой фон: медленно дрейфующие точки со связями
(function(){
  var c=document.getElementById("bg");if(!c||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var x=c.getContext("2d"),w,h,dpr,P=[],N=0;
  function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+"px";c.style.height=h+"px";x.setTransform(dpr,0,0,dpr,0,0);
    N=Math.round(Math.min(70,w*h/22000));P=[];for(var i=0;i<N;i++)P.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.4+.6});}
  function frame(){x.clearRect(0,0,w,h);
    for(var i=0;i<N;i++){var p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;
      x.fillStyle="rgba(255,183,27,.55)";x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();
      for(var j=i+1;j<N;j++){var q=P[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;if(d<19600){x.strokeStyle="rgba(255,183,27,"+(.16*(1-d/19600))+")";x.lineWidth=1;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();}}}
    requestAnimationFrame(frame);}
  size();addEventListener("resize",size);frame();
})();
</script></body></html>
